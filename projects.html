<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects — ProjectForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/app-shell.css">
</head>
<body class="app">
<div class="shell">

  <aside class="sidebar">
    <a href="dashboard.html" class="brand"><span class="brand-mark"></span> ProjectForge</a>
    <nav class="sidebar-nav">
      <span class="sidebar-section-label">Workspace</span>
      <a href="dashboard.html" class="side-link" data-page="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="projects.html" class="side-link" data-page="projects.html"><i class="fa-solid fa-diagram-project"></i> My Projects</a>
      <a href="calendar.html" class="side-link" data-page="calendar.html"><i class="fa-regular fa-calendar"></i> Calendar</a>
      <a href="files.html" class="side-link" data-page="files.html"><i class="fa-regular fa-folder-open"></i> File Manager</a>
      <a href="analytics.html" class="side-link" data-page="analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a>
      <a href="team-chat.html" class="side-link" data-page="team-chat.html"><i class="fa-regular fa-comments"></i> Team Chat</a>

      <span class="sidebar-section-label">Account</span>
      <a href="notifications.html" class="side-link" data-page="notifications.html"><i class="fa-regular fa-bell"></i> Notifications</a>
      <a href="profile.html" class="side-link" data-page="profile.html"><i class="fa-regular fa-user"></i> Profile</a>
      <a href="settings.html" class="side-link" data-page="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
      <a href="admin-dashboard.html" class="side-link" data-page="admin-dashboard.html"><i class="fa-solid fa-shield-halved"></i> Admin Panel</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" data-user-avatar></div>
        <div class="user-chip-meta">
          <div class="user-chip-name" data-user-name>—</div>
          <div class="user-chip-role" data-user-role>—</div>
        </div>
        <button class="icon-btn btn-icon-only" data-logout title="Log out"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="nav-toggle-mobile"><i class="fa-solid fa-bars"></i></button>
      <div>
        <h1>My Projects</h1>
        <div class="topbar-sub">Everything you own or collaborate on</div>
      </div>
      <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="project-search" placeholder="Search projects…"></div>
      <div class="topbar-actions">
        <button class="theme-toggle icon-btn"><i class="fa-solid fa-sun"></i></button>
        <a href="notifications.html" class="icon-btn"><span class="dot"></span><i class="fa-regular fa-bell"></i></a>
        <button class="btn btn-primary btn-sm" data-open-create-project><i class="fa-solid fa-plus"></i> New project</button>
      </div>
    </header>

    <div class="page-body">
      <div class="section-head">
        <div style="display:flex;gap:.6rem;flex-wrap:wrap;">
          <button class="tag-pill filter-chip active" data-filter="all" style="cursor:pointer;">All</button>
          <button class="tag-pill filter-chip" data-filter="active" style="cursor:pointer;">Active</button>
          <button class="tag-pill filter-chip" data-filter="completed" style="cursor:pointer;">Completed</button>
          <button class="tag-pill filter-chip" data-filter="archived" style="cursor:pointer;">Archived</button>
        </div>
      </div>

      <div class="project-grid" id="project-grid"></div>

      <div class="empty-state" id="projects-empty" style="display:none;">
        <i class="fa-regular fa-folder-open"></i>
        <h4>No projects here yet</h4>
        <p>Create a project to start organizing tasks, files, and your team.</p>
        <button class="btn btn-primary" data-open-create-project><span class="btn-label">Create your first project</span></button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="project-modal">
  <div class="modal glass">
    <div class="modal-head">
      <h3 id="project-modal-title">Create project</h3>
      <button class="modal-close" data-close-modal><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="project-form">
      <div class="field">
        <label for="project-name">Project name</label>
        <input type="text" id="project-name" required placeholder="e.g. Mobile App Redesign">
      </div>
      <div class="field">
        <label for="project-description">Description</label>
        <textarea id="project-description" placeholder="What's this project about?"></textarea>
      </div>
      <div class="input-row">
        <div class="field">
          <label for="project-priority">Priority</label>
          <select id="project-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field">
          <label for="project-deadline">Deadline</label>
          <input type="date" id="project-deadline">
        </div>
      </div>
      <div class="field">
        <label for="project-tags">Tags <span class="text-secondary" style="font-weight:400;">(comma separated)</span></label>
        <input type="text" id="project-tags" placeholder="design, frontend, urgent">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary"><span class="btn-label">Save project</span><span class="spinner"></span></button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { requireAuth } from "./js/app.js";
  import { initProjectsPage } from "./js/projects.js";
  requireAuth().then(({ user }) => initProjectsPage(user));
</script>
</body>
</html>
