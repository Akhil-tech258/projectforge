<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — ProjectForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/app-shell.css">
</head>
<body>
<div class="auth-wrap">

  <div class="auth-visual">
    <a href="index.html" class="brand"><span class="brand-mark"></span> ProjectForge</a>
    <blockquote>
      "Everything our team needed — boards, docs, chat, and deadlines — finally in one place."
      <cite>— Early ProjectForge user</cite>
    </blockquote>
    <div class="text-secondary" style="font-size:.8rem;">© 2026 ProjectForge. All rights reserved.</div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <h1>Set a new password</h1>
      <p class="text-secondary">Choose a strong password you haven't used before.</p>

      <div class="form-alert" id="form-alert"></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" required placeholder="At least 8 characters" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input type="password" id="confirm-password" required placeholder="Re-enter your password" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          <span class="btn-label">Update password</span>
          <span class="spinner"></span>
        </button>
      </form>

      <p class="auth-foot"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to login</a></p>
    </div>
  </div>

</div>

<script type="module">
  import { initResetPasswordForm } from "./js/auth.js";
  initResetPasswordForm();
</script>
</body>
</html>
