<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — ProjectForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/app-shell.css">
</head>
<body>
<div class="auth-wrap">

  <div class="auth-visual">
    <a href="index.html" class="brand"><span class="brand-mark"></span> ProjectForge</a>
    <blockquote>
      "Locked out once, back in within a minute — the reset flow just works."
      <cite>— Early ProjectForge user</cite>
    </blockquote>
    <div class="text-secondary" style="font-size:.8rem;">© 2026 ProjectForge. All rights reserved.</div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <h1>Forgot your password?</h1>
      <p class="text-secondary">Enter the email on your account and we'll send a reset link.</p>

      <div class="form-alert" id="form-alert"></div>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          <span class="btn-label">Send reset link</span>
          <span class="spinner"></span>
        </button>
      </form>

      <p class="auth-foot"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to login</a></p>
    </div>
  </div>

</div>

<script type="module">
  import { initForgotPasswordForm } from "./js/auth.js";
  initForgotPasswordForm();
</script>
</body>
</html>
