<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Board — ProjectForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/app-shell.css">
</head>
<body class="app">
<div class="shell">

  <aside class="sidebar">
    <a href="dashboard.html" class="brand"><span class="brand-mark"></span> ProjectForge</a>
    <nav class="sidebar-nav">
      <span class="sidebar-section-label">Workspace</span>
      <a href="dashboard.html" class="side-link" data-page="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="projects.html" class="side-link" data-page="projects.html"><i class="fa-solid fa-diagram-project"></i> My Projects</a>
      <a href="calendar.html" class="side-link" data-page="calendar.html"><i class="fa-regular fa-calendar"></i> Calendar</a>
      <a href="files.html" class="side-link" data-page="files.html"><i class="fa-regular fa-folder-open"></i> File Manager</a>
      <a href="analytics.html" class="side-link" data-page="analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a>
      <a href="team-chat.html" class="side-link" data-page="team-chat.html"><i class="fa-regular fa-comments"></i> Team Chat</a>

      <span class="sidebar-section-label">Account</span>
      <a href="notifications.html" class="side-link" data-page="notifications.html"><i class="fa-regular fa-bell"></i> Notifications</a>
      <a href="profile.html" class="side-link" data-page="profile.html"><i class="fa-regular fa-user"></i> Profile</a>
      <a href="settings.html" class="side-link" data-page="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
      <a href="admin-dashboard.html" class="side-link" data-page="admin-dashboard.html"><i class="fa-solid fa-shield-halved"></i> Admin Panel</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" data-user-avatar></div>
        <div class="user-chip-meta">
          <div class="user-chip-name" data-user-name>—</div>
          <div class="user-chip-role" data-user-role>—</div>
        </div>
        <button class="icon-btn btn-icon-only" data-logout title="Log out"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="nav-toggle-mobile"><i class="fa-solid fa-bars"></i></button>
      <div style="min-width:0;">
        <h1 style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" data-project-name>Loading…</h1>
        <div class="topbar-sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px;" data-project-description></div>
      </div>
      <div class="topbar-actions">
        <a href="projects.html" class="btn btn-ghost btn-sm"><i class="fa-solid fa-arrow-left"></i> All projects</a>
        <button class="theme-toggle icon-btn"><i class="fa-solid fa-sun"></i></button>
      </div>
    </header>

    <div class="page-body">
      <div class="section-head">
        <div>
          <h2>Kanban Board</h2>
          <p>Drag cards between columns to update task status.</p>
        </div>
        <button class="btn btn-primary btn-sm" id="new-task-btn"><i class="fa-solid fa-plus"></i> New task</button>
      </div>

      <div class="kanban-board" id="kanban-board"></div>
    </div>
  </div>
</div>

<!-- Task modal -->
<div class="modal-overlay" id="task-modal">
  <div class="modal glass modal-lg">
    <div class="modal-head">
      <h3 id="task-modal-title">New task</h3>
      <button class="modal-close" data-close-modal><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="task-form">
      <div class="field">
        <label for="task-title">Title</label>
        <input type="text" id="task-title" required placeholder="e.g. Design the onboarding flow">
      </div>
      <div class="field">
        <label for="task-description">Description</label>
        <textarea id="task-description" placeholder="Add more detail…"></textarea>
      </div>
      <div class="input-row">
        <div class="field">
          <label for="task-priority">Priority</label>
          <select id="task-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field">
          <label for="task-status">Status</label>
          <select id="task-status">
            <option value="todo">To Do</option>
            <option value="in_progress">In Progress</option>
            <option value="review">Review</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </div>
      <div class="input-row">
        <div class="field">
          <label for="task-due-date">Due date</label>
          <input type="date" id="task-due-date">
        </div>
        <div class="field">
          <label for="task-labels">Labels <span class="text-secondary" style="font-weight:400;">(comma separated)</span></label>
          <input type="text" id="task-labels" placeholder="frontend, bug">
        </div>
      </div>
      <div class="field">
        <label>Checklist</label>
        <div id="task-checklist-list"></div>
        <button type="button" class="add-card-btn" id="task-add-checklist-item"><i class="fa-solid fa-plus"></i> Add checklist item</button>
      </div>
      <div class="modal-actions" style="justify-content:space-between;">
        <button type="button" id="task-delete-btn" class="btn btn-danger btn-sm" style="display:none;"><i class="fa-solid fa-trash"></i> Delete</button>
        <div style="display:flex;gap:.75rem;">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary"><span class="btn-label">Save task</span><span class="spinner"></span></button>
        </div>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { requireAuth } from "./js/app.js";
  import { initKanbanPage } from "./js/tasks.js";

  requireAuth().then(({ user }) => {
    initKanbanPage(user);
    document.getElementById("new-task-btn").addEventListener("click", () => {
      document.querySelector('[data-add-task="todo"]')?.click();
    });
  });
</script>
</body>
</html>
